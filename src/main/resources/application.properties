
spring.application.name=ecommerce

# PostgreSQL (override via env vars in non-local environments, e.g. SPRING_DATASOURCE_URL)
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_password

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Map entities to DTOs inside service transactions, never lazily in the web layer
spring.jpa.open-in-view=false
# Load variants of a page of products in batches instead of one query per product (avoids N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Web
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# Browser apps allowed to call the API (admin panel / storefront dev servers). Comma-separated.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Image uploads: saved under this folder and served at /uploads/**
app.storage.local-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
